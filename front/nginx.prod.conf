# 生产环境：浏览器 → :81 → 前端 dist 静态 + API 反代 8400
# 部署前先在 front 目录执行：npm run build
# 用法：复制/软链到 nginx 配置目录后 nginx -t && nginx -s reload
#
# 上传目录统一为 /var/www/huijin/backend/uploads/
# 若旧图片在 backend/app/uploads/，先合并再 reload：
#   mkdir -p /var/www/huijin/backend/uploads
#   cp -a /var/www/huijin/backend/app/uploads/. /var/www/huijin/backend/uploads/
#   chown -R www-data:www-data /var/www/huijin/backend/uploads

server {
    listen       81;
    server_name  _;
    client_max_body_size 30M;

    location ^~ /uploads/ {
        alias /var/www/huijin/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8400/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        root /var/www/huijin/front/dist;
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public";
    }

    location /assets/ {
        root /var/www/huijin/front/dist;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
