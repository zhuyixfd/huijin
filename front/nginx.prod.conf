# 生产环境：浏览器 → :81 → 前端 dist 静态 + API 反代 8400
#
# 上传目录必须与后端写入路径一致：
#   /var/www/huijin/backend/app/uploads/
# （来料单 / 案例图都在这个目录下；写成 backend/uploads/ 会 404）

server {
    listen       81;
    server_name  _;
    client_max_body_size 30M;

    location ^~ /uploads/ {
        alias /var/www/huijin/backend/app/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8400/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        root /var/www/huijin/front/dist;
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public";
    }

    location /assets/ {
        root /var/www/huijin/front/dist;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
